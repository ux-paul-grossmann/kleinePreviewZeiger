<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    :root {
      --popup-bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --input-bg: #f1f5f9;
      --input-border: #cbd5e1;
      --input-text: #1e293b;
      --hint: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --popup-bg: #1e293b;
        --card-bg: #0f172a;
        --card-border: #334155;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --input-bg: #1e293b;
        --input-border: #334155;
        --input-text: #f1f5f9;
        --hint: #64748b;
      }
    }
    html {
      background: transparent !important;
      border-radius: 12px;
      overflow: hidden;
    }
    body {
      width: 260px;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: transparent !important;
      color: var(--text-main);
      overflow: hidden;
    }
    .popup-wrapper {
      background: var(--popup-bg);
      border-radius: 12px;
      padding: 10px;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .header svg { width: 14px; height: 14px; opacity: 0.7; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card:last-child { margin-bottom: 0; }
    .card label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      display: block;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .card-header label { margin-bottom: 0; }
    select {
      width: 100%;
      padding: 8px 32px 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 13px;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 12px;
    }
    select:focus { border-color: var(--text-muted); }
    select::-ms-expand { display: none; }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      padding: 8px 76px 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 13px;
      outline: none;
    }
    .input-wrap input::placeholder { color: var(--text-muted); opacity: 0.7; }
    .input-wrap input:focus { border-color: var(--text-muted); }
    .save-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: #38bdf8;
      color: #0f172a;
      border: none;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .save-btn:hover { background: #0ea5e9; }
    .save-btn:active { transform: translateY(-50%) scale(0.96); }
    .hint {
      font-size: 10px;
      color: var(--hint);
      margin-top: 6px;
      line-height: 1.3;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 20px;
      transition: 0.2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider { background: #38bdf8; border-color: #38bdf8; }
    input:checked + .slider:before { transform: translateX(16px); background: #0f172a; }

  </style>
</head>
<body>
  <div class="popup-wrapper">
    <div class="header">
      <span>kleinePreviewZeiger</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </div>

    <div class="card">
      <label for="theme">Erscheinungsbild</label>
      <select id="theme">
        <option value="system">System (Auto)</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div class="card">
      <label for="home">Wohnort (für Route)</label>
      <div class="input-wrap">
        <input id="home" type="text" placeholder="z. B. 50823 Köln">
        <button id="saveHome" class="save-btn">Speichern</button>
      </div>
      <div class="hint">Wird als Start bei <b>Route planen</b> verwendet</div>
    </div>

    <div class="card">
      <div class="card-header">
        <label for="themeToggle" style="margin:0;">Themen</label>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="hint" style="margin-top:0;">Themen-Drawer in Vorschau-Card an/aus</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
