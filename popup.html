<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 180px;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e293b;
      color: #f8fafc;
      margin: 0;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 6px;
      padding-right: 32px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
    }
    select::-ms-expand { display: none; }
  </style>
</head>
<body>
  <label for="theme">Erscheinungsbild</label>
  <select id="theme">
    <option value="system">System (Auto)</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <label for="home" style="margin-top:12px;">Wohnort (für Route)</label>
  <input id="home" type="text" placeholder="z. B. 50823 Köln" style="width:100%; padding:6px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#f8fafc; font-size:13px; outline:none; box-sizing:border-box;">
  <div style="font-size:10px; color:#94a3b8; margin-top:4px;">Wird als Start bei Route planen verwendet · Leer lassen wenn unbekannt</div>
  <script src="popup.js"></script>
</body>
</html>
