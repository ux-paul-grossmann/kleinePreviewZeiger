<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Popup-Stile: helle und dunkle Farbwelt plus Karten-Layout -->
  <style>
    * { box-sizing: border-box; }
    :root {
      --popup-bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --input-bg: #f1f5f9;
      --input-border: #cbd5e1;
      --input-text: #1e293b;
      --hint: #64748b;
    }
    /* Dunkelwelt: Betriebssystem dunkel ohne Festlegung, oder fest dunkel */
    @media (prefers-color-scheme: dark) {
      :root:not([data-kb-theme="light"]) {
        --popup-bg: #1e293b;
        --card-bg: #0f172a;
        --card-border: #334155;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --input-bg: #1e293b;
        --input-border: #334155;
        --input-text: #f1f5f9;
        --hint: #64748b;
      }
    }
    /* Dunkelwelt bei fester Wahl (auch bei hellem Betriebssystem) */
    :root[data-kb-theme="dark"] {
      --popup-bg: #1e293b;
      --card-bg: #0f172a;
      --card-border: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --input-bg: #1e293b;
      --input-border: #334155;
      --input-text: #f1f5f9;
      --hint: #64748b;
    }
    html {
      background: transparent !important;
      border-radius: 12px;
      overflow: hidden;
    }
    body {
      width: 260px;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: transparent !important;
      color: var(--text-main);
      overflow: hidden;
    }
    .popup-wrapper {
      background: var(--popup-bg);
      border-radius: 12px;
      padding: 10px;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .header svg { width: 14px; height: 14px; opacity: 0.7; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card:last-child { margin-bottom: 0; }
    .card label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      display: block;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .card-header label { margin-bottom: 0; }
    /* Dreistufen-Thema: Sonne, System, Mond mit Kreisanzeige */
    .theme-seg {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 999px;
      padding: 4px;
    }
    .theme-seg-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--text-muted);
    }
    .theme-seg-btn .thumb {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid transparent;
    }
    .theme-seg-btn svg { width: 20px; height: 20px; }
    .theme-seg-btn.active { color: var(--text-main); }
    .theme-seg-btn.active .thumb {
      background: var(--card-bg);
      border-color: var(--input-border);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    /* Akzentfarbe: Punkte wie macOS Darstellung */
    .accent-label { margin-top: 10px; }
    .accent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 0;
    }
    .accent-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      padding: 0;
      cursor: pointer;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }
    .accent-dot.active { outline-color: var(--text-muted); }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      padding: 8px 76px 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 13px;
      outline: none;
    }
    .input-wrap input::placeholder { color: var(--text-muted); opacity: 0.7; }
    .input-wrap input:focus { border-color: var(--text-muted); }
    .save-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: #38bdf8;
      color: #0f172a;
      border: none;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .save-btn:hover { background: #0ea5e9; }
    .save-btn:active { transform: translateY(-50%) scale(0.96); }
    .hint {
      font-size: 10px;
      color: var(--hint);
      margin-top: 6px;
      line-height: 1.3;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 20px;
      transition: 0.2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider { background: #38bdf8; border-color: #38bdf8; }
    input:checked + .slider:before { transform: translateX(16px); background: #0f172a; }

  </style>
</head>
<body>
  <div class="popup-wrapper">
    <!-- Kopfzeile mit Erweiterungsname -->
    <div class="header">
      <span>kleinePreviewZeiger</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </div>

    <!-- Karte: Erscheinungsbild wählen -->
    <div class="card">
      <label>Erscheinungsbild</label>
      <div class="theme-seg" role="radiogroup" aria-label="Erscheinungsbild">
        <button class="theme-seg-btn" data-theme="light" role="radio" aria-checked="false" aria-label="Hell" title="Hell">
          <span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        </button>
        <button class="theme-seg-btn" data-theme="system" role="radio" aria-checked="true" aria-label="System" title="System">
          <span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
        </button>
        <button class="theme-seg-btn" data-theme="dark" role="radio" aria-checked="false" aria-label="Dunkel" title="Dunkel">
          <span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
        </button>
      </div>
      <!-- Zeile: Akzentfarbe wie macOS Darstellung -->
      <label class="accent-label">Akzentfarbe</label>
      <div class="accent-row" role="radiogroup" aria-label="Akzentfarbe">
        <button class="accent-dot" data-accent="multicolor" role="radio" aria-checked="true" aria-label="Mehrfarbig" title="Mehrfarbig" style="background: conic-gradient(#ff453a, #ff9f0a, #ffd60a, #30d158, #0a84ff, #bf5af2, #ff375f, #ff453a);"></button>
        <button class="accent-dot" data-accent="blau" role="radio" aria-checked="false" aria-label="Blau" title="Blau" style="background:#0A84FF;"></button>
        <button class="accent-dot" data-accent="violett" role="radio" aria-checked="false" aria-label="Violett" title="Violett" style="background:#BF5AF2;"></button>
        <button class="accent-dot" data-accent="pink" role="radio" aria-checked="false" aria-label="Pink" title="Pink" style="background:#FF375F;"></button>
        <button class="accent-dot" data-accent="rot" role="radio" aria-checked="false" aria-label="Rot" title="Rot" style="background:#FF453A;"></button>
        <button class="accent-dot" data-accent="orange" role="radio" aria-checked="false" aria-label="Orange" title="Orange" style="background:#FF9F0A;"></button>
        <button class="accent-dot" data-accent="gelb" role="radio" aria-checked="false" aria-label="Gelb" title="Gelb" style="background:#FFD60A;"></button>
        <button class="accent-dot" data-accent="gruen" role="radio" aria-checked="false" aria-label="Grün" title="Grün" style="background:#30D158;"></button>
        <button class="accent-dot" data-accent="grau" role="radio" aria-checked="false" aria-label="Grau" title="Grau" style="background:#98989F;"></button>
      </div>
    </div>

    <!-- Karte: Wohnort für Routenplanung speichern -->
    <div class="card">
      <label for="home">Wohnort (für Route)</label>
      <div class="input-wrap">
        <input id="home" type="text" placeholder="z. B. 50823 Köln">
        <button id="saveHome" class="save-btn">Speichern</button>
      </div>
      <div class="hint">Wird als Start bei <b>Route planen</b> verwendet</div>
    </div>

    <!-- Karte: Debug-Oberfläche in der Vorschau schalten -->
    <div class="card">
      <div class="card-header">
        <label for="debugToggle" style="margin:0;">Debug-UI</label>
        <label class="switch">
          <input type="checkbox" id="debugToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="hint" style="margin-top:0;">Debug-Schalter in Vorschau-Card an/aus</div>
      <!-- Unterpunkte: Spiegel der Card-Schalter, nur bei Hauptschalter an -->
      <div id="debugToolsList">
        <div class="card-header" style="margin-top:8px;">
          <label for="debugInitialToggle" style="margin:0; font-weight:400;">Beim Start aktiv</label>
          <label class="switch">
            <input type="checkbox" id="debugInitialToggle" data-kb-key="kbDebugInitial" data-kb-default="true">
            <span class="slider"></span>
          </label>
        </div>
        <div class="card-header" style="margin-top:8px;">
          <label for="dbgZones" style="margin:0; font-weight:400;">Zonen</label>
          <label class="switch">
            <input type="checkbox" id="dbgZones" data-kb-key="kbDbgZones" data-kb-default="true">
            <span class="slider"></span>
          </label>
        </div>
        <div class="card-header" style="margin-top:8px;">
          <label for="dbgTransparent" style="margin:0; font-weight:400;">Transparent</label>
          <label class="switch">
            <input type="checkbox" id="dbgTransparent" data-kb-key="kbDbgTransparent" data-kb-default="false">
            <span class="slider"></span>
          </label>
        </div>
        <div class="card-header" style="margin-top:8px;">
          <label for="dbgMouse" style="margin:0; font-weight:400;">Maus</label>
          <label class="switch">
            <input type="checkbox" id="dbgMouse" data-kb-key="kbDbgMouse" data-kb-default="true">
            <span class="slider"></span>
          </label>
        </div>
        <div class="card-header" style="margin-top:8px;">
          <label for="dbgLabels" style="margin:0; font-weight:400;">ABC</label>
          <label class="switch">
            <input type="checkbox" id="dbgLabels" data-kb-key="kbDbgLabels" data-kb-default="true">
            <span class="slider"></span>
          </label>
        </div>
        <div class="card-header" style="margin-top:8px;">
          <label for="dbgClamp" style="margin:0; font-weight:400;">Clamp</label>
          <label class="switch">
            <input type="checkbox" id="dbgClamp" data-kb-key="kbDbgClamp" data-kb-default="true">
            <span class="slider"></span>
          </label>
        </div>
        <div class="card-header" style="margin-top:8px;">
          <label for="dbgItems" style="margin:0; font-weight:400;">Items</label>
          <label class="switch">
            <input type="checkbox" id="dbgItems" data-kb-key="kbDbgItems" data-kb-default="true">
            <span class="slider"></span>
          </label>
        </div>
        <div class="card-header" style="margin-top:8px;">
          <label for="dbgLog" style="margin:0; font-weight:400;">Log</label>
          <label class="switch">
            <input type="checkbox" id="dbgLog" data-kb-key="kbDbgLog" data-kb-default="true">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <!-- Popup-Logik laden -->
  <script src="popup.js"></script>
</body>
</html>
