<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 260px;
      margin: 0;
      padding: 10px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e293b;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }
    .header svg { width: 14px; height: 14px; opacity: 0.7; }
    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card:last-child { margin-bottom: 0; }
    .card label {
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
      display: block;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    select {
      width: 100%;
      padding: 8px 32px 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 12px;
    }
    select:focus { border-color: #475569; }
    select::-ms-expand { display: none; }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      padding: 8px 76px 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 13px;
      outline: none;
    }
    .input-wrap input::placeholder { color: #64748b; }
    .input-wrap input:focus { border-color: #475569; }
    .save-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: #38bdf8;
      color: #0f172a;
      border: none;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .save-btn:hover { background: #0ea5e9; }
    .save-btn:active { transform: translateY(-50%) scale(0.96); }
    .hint {
      font-size: 10px;
      color: #64748b;
      margin-top: 6px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>kleinePreviewZeiger</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </div>

  <div class="card">
    <label for="theme">Erscheinungsbild</label>
    <select id="theme">
      <option value="system">System (Auto)</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="card">
    <label for="home">Wohnort (für Route)</label>
    <div class="input-wrap">
      <input id="home" type="text" placeholder="z. B. 50823 Köln">
      <button id="saveHome" class="save-btn">Speichern</button>
    </div>
    <div class="hint">Wird als Start bei Route planen verwendet · Leer lassen wenn unbekannt</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
