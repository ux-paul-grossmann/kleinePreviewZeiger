<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Popup-Stile: helle und dunkle Farbwelt plus Karten-Layout -->
  <style>
    * { box-sizing: border-box; }
    :root {
      --popup-bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --input-bg: #f1f5f9;
      --input-border: #cbd5e1;
      --input-text: #1e293b;
      --hint: #64748b;
      --body-bg: lightgrey;
      --save-bg: #38bdf8;
      --save-text: #0f172a;
      --save-hover: #0ea5e9;
      --icon-hover: rgba(211, 211, 211, 0.5);
      --scroll-thumb: rgba(100, 116, 139, 0.5);
    }
    /* Dunkelwelt: Betriebssystem dunkel ohne Festlegung, oder fest dunkel */
    @media (prefers-color-scheme: dark) {
      :root:not([data-kb-theme="light"]) {
        --popup-bg: #1e293b;
        --card-bg: #0f172a;
        --card-border: #334155;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --input-bg: #1e293b;
        --input-border: #334155;
        --input-text: #f1f5f9;
        --hint: #64748b;
        --body-bg: #171E29;
        --save-bg: #0284c7;
        --save-text: #ffffff;
        --save-hover: #0ea5e9;
        --icon-hover: rgba(148, 163, 184, 0.35);
        --scroll-thumb: #2e4a6b;
      }
    }
    /* Dunkelwelt bei fester Wahl (auch bei hellem Betriebssystem) */
    :root[data-kb-theme="dark"] {
      --popup-bg: #1e293b;
      --card-bg: #0f172a;
      --card-border: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --input-bg: #1e293b;
      --input-border: #334155;
      --input-text: #f1f5f9;
      --hint: #64748b;
      --body-bg: #171E29;
      --save-bg: #0284c7;
      --save-text: #ffffff;
      --save-hover: #0ea5e9;
      --icon-hover: rgba(148, 163, 184, 0.35);
      --scroll-thumb: #2e4a6b;
    }
    html {
      background: transparent !important;
      border-radius: 12px;
      overflow: hidden;
    }
    /* Minimale Scrollbar je Farbwelt */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
    body {
      width: 260px;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--body-bg) !important;
      color: var(--text-main);
      overflow: hidden;
    }
    .popup-wrapper {
      background: var(--popup-bg);
      border-radius: 12px;
      padding: 10px;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .header svg { width: 14px; height: 14px; opacity: 0.7; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card:last-child { margin-bottom: 0; }
    .card label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      display: block;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .card-header label { margin-bottom: 0; }
    /* Erweiterte Ansicht: breiteres Popup, nur eine Ansicht sichtbar */
    body.kb-advanced { width: 340px; }
    #viewAdvanced { display: none; }
    body.kb-advanced #viewAdvanced { display: block; }
    body.kb-advanced #viewMain { display: none; }
    /* Kopf Knopf: Zahnrad und Zurück als stille Schaltfläche */
    .icon-btn {
      background: none;
      border: none;
      padding: 3px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { background: var(--icon-hover); border-radius: 50%; }
    /* Gesperrte Toggles in eingeklappten Modul Zeilen */
    .switch input:disabled + .slider { opacity: 0.5; cursor: default; }
    /* Dreistufen-Thema: Sonne, System, Mond mit Kreisanzeige */
    .theme-seg {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 999px;
      padding: 3px;
    }
    .theme-seg-btn {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--text-muted);
    }
    .theme-seg-btn .thumb {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid transparent;
    }
    .theme-seg-btn svg { width: 16px; height: 16px; }
    .theme-seg-btn.active { color: var(--text-main); }
    .theme-seg-btn.active .thumb {
      background: var(--card-bg);
      border-color: var(--input-border);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    /* Akzentfarbe: Punkte wie macOS Darstellung */
    .accent-label { margin-top: 10px; }
    .accent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 0;
    }
    .accent-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      padding: 0;
      cursor: pointer;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }
    .accent-dot.active { outline-color: var(--text-muted); }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      padding: 8px 76px 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 13px;
      outline: none;
    }
    .input-wrap input::placeholder { color: var(--text-muted); opacity: 0.7; }
    .input-wrap input:focus { border-color: var(--text-muted); }
    .save-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--save-bg);
      color: var(--save-text);
      border: none;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .save-btn:hover { background: var(--save-hover); }
    .save-btn:active { transform: translateY(-50%) scale(0.96); }
    .hint {
      font-size: 10px;
      color: var(--hint);
      margin-top: 6px;
      line-height: 1.3;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 20px;
      transition: 0.2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider { background: #38bdf8; border-color: #38bdf8; }
    input:checked + .slider:before { transform: translateX(16px); background: #0f172a; }

  </style>
</head>
